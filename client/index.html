<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Smart Tourist Safety</title>
    <script>try{var th=localStorage.getItem('sts.theme');if(th!=='light'&&th!=='dark')th=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';document.documentElement.dataset.theme=th}catch(e){}try{var z=+localStorage.getItem('sts.textSize');if(z>=85&&z<=175&&z!==100)document.documentElement.style.fontSize=z+'%'}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
